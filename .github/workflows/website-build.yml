name: Website build

on:
  push:
    branches: [main, release-hardening-nov-2026]
    paths:
      - "the-off-grid-complete/client/**"
      - ".github/workflows/website-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "the-off-grid-complete/client/**"
      - ".github/workflows/website-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-off-grid-complete/client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: the-off-grid-complete/client/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build admin website
        run: npm run build
