name: Original website backend tests

on:
  pull_request:
    paths:
      - "the-off-grid-complete/server/**"
      - ".github/workflows/original-backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "the-off-grid-complete/server/**"
      - ".github/workflows/original-backend-tests.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-off-grid-complete/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: the-off-grid-complete/server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Syntax-check server source
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
